name: SoloLeveling
options:
  bundleIdPrefix: com.daniel
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # <-- set your Apple Developer Team ID in Xcode
    CODE_SIGN_STYLE: Automatic
targets:
  SoloLeveling:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ./SoloLeveling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniel.sololeveling   # placeholder - make unique
        PRODUCT_NAME: "Solo Leveling"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"       # iPhone + iPad
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Solo Leveling"
        NSCameraUsageDescription: "Scan your desktop's sync code to pull in your progress."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
